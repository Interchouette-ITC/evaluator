[package]
name = "evaluator"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Evaluate JS hooks on live pages (CLI + MCP over shared Node engine)"
readme = "README.md"
default-run = "evaluator"
authors = ["Interchouette <contact@interchouette.net>"]

[lib]
name = "evaluator"
path = "src/lib.rs"

[[bin]]
name = "evaluator"
path = "src/bin/evaluator/main.rs"
required-features = ["cli"]

[[bin]]
name = "evaluator-mcp"
path = "src/bin/evaluator_mcp.rs"
required-features = ["mcp"]

[dependencies]
anyhow = { version = "1", optional = true }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
  "json",
], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
regex = "1"
rmcp = { version = "3.1.2", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
], optional = true }
rustyline = { version = "18", optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "process",
  "io-util",
  "time",
  "net",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }

[features]
default = []
cli = ["dep:anyhow", "dep:clap", "dep:rustyline", "dep:serde", "dep:serde_json"]
mcp = [
  "cli",
  "dep:axum",
  "dep:rmcp",
  "dep:schemars",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
]
apps = ["cli", "mcp"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
