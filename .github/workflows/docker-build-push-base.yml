name: CI/CD Image base (Chromium)

on:
  workflow_dispatch:
  push:
    branches: [dev, main, master]
    paths:
      - docker/Dockerfile.base
      - .github/workflows/docker-build-push-base.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push-base:
    name: Build and Push evaluator-base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build base image
        run: make docker-build-base

      - name: Push base to Docker Hub
        run: make docker-push-base-hub

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push base to personal GHCR
        run: make docker-push-base-ghcr-personal

      - name: Push base to org GHCR
        run: make docker-push-base-ghcr-itc
