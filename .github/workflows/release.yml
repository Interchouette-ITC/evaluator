name: Release - Build and Push Versioned Images

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag matches package.json
        id: extract
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected: vX.Y.Z (e.g. v1.0.0)"
            exit 1
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag version ($VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "OK: tag $TAG matches package.json $PKG_VERSION"

  build-and-push:
    name: Build and Push Images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (monolith)
        run: make docker-build TAG=latest APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push :version and :latest to Docker Hub
        run: make docker-push-release-hub APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping Render redeploy"
            exit 0
          fi
          echo "Triggering Render deploy hook…"
          curl -fsS -X GET "${RENDER_DEPLOY_HOOK}"
          echo
          echo "Render deploy requested"

      - name: Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: interchouette/evaluator
          short-description: evaluator.interchouette.net — JS eval (Playwright / Puppeteer), web + CLI + MCP
          readme-filepath: docker/DOCKERHUB.md

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push to personal GHCR
        run: make docker-push-release-ghcr-personal APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push to org GHCR
        run: make docker-push-release-ghcr-itc APP_VERSION=${{ needs.validate.outputs.version }}

  summary:
    name: Summary
    needs: [validate, build-and-push]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Summary
        run: |
          V="${{ needs.validate.outputs.version }}"
          echo "Pushed interchouette/evaluator:${V} and :latest"
          echo "Pushed ghcr.io/groussac/evaluator:${V} and :latest"
          echo "Pushed ghcr.io/interchouette-itc/evaluator:${V} and :latest"
          echo "Note: set GHCR package visibility to Public once in the GitHub UI if still private"
