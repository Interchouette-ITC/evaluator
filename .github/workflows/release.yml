name: Release - Build and Push Versioned Images

# Mirrors tvscreener-rs: validate vX.Y.Z → attach host Rust bins → push monolith
# image :X.Y.Z + :latest to Hub + GHCR → optional Render redeploy.
on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Validate release tag matches package.json and Cargo.toml
        id: extract
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected: vX.Y.Z (e.g. v1.0.0)"
            exit 1
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./www/package.json').version")"
          CARGO_VERSION="$(awk '/^version = /{gsub(/"/, "", $3); print $3; exit}' rust/Cargo.toml)"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag version ($VERSION) does not match www/package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Release tag version ($VERSION) does not match rust/Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "OK: tag $TAG matches www/package.json + rust/Cargo.toml $VERSION"

  build-and-push:
    name: Build and Push Images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries (CLI + MCP)
        working-directory: rust
        run: cargo build --release --features apps --bin evaluator --bin evaluator-mcp

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rust/target/release/evaluator
            rust/target/release/evaluator-mcp

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (monolith)
        run: make docker-build TAG=latest APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push :version and :latest to Docker Hub
        run: make docker-push-release-hub APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping Render redeploy"
            exit 0
          fi
          echo "Triggering Render deploy hook…"
          curl -fsS -X GET "${RENDER_DEPLOY_HOOK}"
          echo
          echo "Render deploy requested"

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push to personal GHCR
        run: make docker-push-release-ghcr-personal APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Push to ghcr.io/interchouette and interchouette-itc
        run: make docker-push-release-ghcr-itc APP_VERSION=${{ needs.validate.outputs.version }}

  summary:
    name: Summary
    needs: [validate, build-and-push]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Summary
        run: |
          V="${{ needs.validate.outputs.version }}"
          echo "Pushed interchouette/evaluator:${V} and :latest"
          echo "Pushed ghcr.io/groussac/evaluator:${V} and :latest"
          echo "Pushed ghcr.io/interchouette/evaluator:${V} and :latest"
          echo "Pushed ghcr.io/interchouette-itc/evaluator:${V} and :latest"
          echo "Attached release binaries: evaluator, evaluator-mcp (linux glibc)"
          echo "Image contents: Angular SPA + Nest + Node serve|evaluate|batch + Chromium + Rust CLI/MCP"
          echo "Note: set GHCR package visibility to Public once in the GitHub UI if still private"
