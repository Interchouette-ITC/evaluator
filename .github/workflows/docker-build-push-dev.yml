name: CI/CD Image dev

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-dev:
    name: Build and Push Docker Image :dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image :dev (monolith)
        run: make docker-build-dev

      - name: Push :dev to Docker Hub
        run: make docker-push-dev-hub

      - name: Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: interchouette/evaluator
          short-description: Evaluate JS on live pages (web) + companion Rust CLI/MCP image
          readme-filepath: docker/DOCKERHUB.md

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push :dev to personal GHCR
        run: make docker-push-dev-ghcr-personal

      - name: Push :dev to org GHCR
        run: make docker-push-dev-ghcr-itc

      - name: Build tools image :dev (Rust CLI + MCP)
        run: make docker-build-tools-dev

      - name: Push tools :dev to Docker Hub
        run: make docker-push-tools-dev-hub

      - name: Docker Hub description (evaluator-tools)
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: interchouette/evaluator-tools
          short-description: Rust CLI + MCP client for interchouette/evaluator
          readme-filepath: docker/DOCKERHUB.tools.md

      - name: Push tools :dev to personal GHCR
        run: make docker-push-tools-dev-ghcr-personal

      - name: Push tools :dev to org GHCR
        run: make docker-push-tools-dev-ghcr-itc
