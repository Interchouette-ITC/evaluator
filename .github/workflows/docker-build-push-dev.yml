name: CI/CD Image dev

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push-dev:
    name: Build and Push Docker Image :dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image :dev (all-in-one)
        run: make docker-build-dev

      - name: Push :dev to Docker Hub
        run: make docker-push-dev-hub

      # Render does not watch Hub for new digests — call the service Deploy Hook
      # after a successful push so it pulls interchouette/evaluator:dev (or :latest).
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping Render redeploy"
            exit 0
          fi
          echo "Triggering Render deploy hook…"
          curl -fsS -X GET "${RENDER_DEPLOY_HOOK}"
          echo
          echo "Render deploy requested"

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push :dev to personal GHCR
        run: make docker-push-dev-ghcr-personal

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Push :dev to ghcr.io/interchouette and interchouette-itc
        run: make docker-push-dev-ghcr-itc
