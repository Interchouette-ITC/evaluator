services:
  evaluator:
    container_name: evaluator
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: interchouette/evaluator:latest
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    # Do not pin docker/chrome.json: recent runc needs syscalls that profile denied,
    # and a Chrome-only allowlist also breaks Node startup. Default Docker seccomp is fine.

# make docker-run  (or: docker compose -f docker/docker-compose.yml up)
# Visit http://localhost:4000/
#
# Legacy Hub mirror gregoshop/evaluator is deprecated; use interchouette/evaluator
# or ghcr.io/interchouette-itc/evaluator.
