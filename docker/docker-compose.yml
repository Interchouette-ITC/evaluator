services:
  evaluator:
    profiles: ["web"]
    container_name: evaluator
    image: interchouette/evaluator:dev
    ports:
      - "4000:4000"
      - "8788:8788"
    environment:
      - PORT=4000
      - ENABLE_MCP=1
      - EVALUATOR_URL=http://127.0.0.1:4000
      - EVALUATOR_MCP_ADDR=0.0.0.0:8788
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - USE_PLAYWRIGHT=0
      - SQLITE_PATH=/app/data/database.db
      - FUNCTIONS_PATH=/app/data/functions.json
    volumes:
      - evaluator-data:/app/data
      - ../evaluator:/data:ro

volumes:
  evaluator-data:

# All-in-one: web :4000 + MCP HTTP :8788 (ENABLE_MCP=0 for web only)
# make docker-pull-dev && make docker-run
# CLI:  docker compose … run --rm evaluator evaluator -p /data/test.csv -n 1
# stdio: docker run -i --rm --network host -e EVALUATOR_URL=http://127.0.0.1:4000 interchouette/evaluator:dev mcp
